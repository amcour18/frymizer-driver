<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<title>Fry Mizer Driver</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #FFD100; --gold-dark: #B89700; --gold-bg: rgba(255,209,0,.08); --gold-glow: rgba(255,209,0,.18);
  --surface: #fff; --surface-2: #f7f7f5; --surface-3: #ededeb;
  --dark: #0C0C0C; --dark-2: #161616; --dark-3: #1E1E1E;
  --green: #10B981; --green-bg: rgba(16,185,129,.1); --red: #EF4444;
  --text: #1a1a1a; --text-2: #555; --text-3: #999;
  --radius: 14px; --radius-sm: 10px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow: 0 4px 16px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.06);
  --shadow-lg: 0 20px 60px rgba(0,0,0,.15), 0 4px 16px rgba(0,0,0,.1);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, sans-serif; background: var(--surface-2); color: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { cursor: pointer; border: none; font-family: inherit; -webkit-tap-highlight-color: transparent; }
input, select { font-family: inherit; -webkit-tap-highlight-color: transparent; }

.screen { position: fixed; inset: 0; display: none; flex-direction: column; overflow: hidden; }
.screen.active { display: flex; }

/* ── ICON HELPER ── */
.icon-inline { display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; flex-shrink: 0; }
.icon-inline svg { width: 100%; height: 100%; }

/* ── LOGIN ── */
.login-screen { background: var(--dark); align-items: center; justify-content: center; padding: 24px; position: relative; overflow: hidden; }
.login-screen::before { content: ''; position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, var(--gold-glow) 0%, transparent 70%); top: -200px; left: -100px; pointer-events: none; }
.login-screen::after { content: ''; position: absolute; width: 400px; height: 400px; background: radial-gradient(circle, rgba(255,209,0,.06) 0%, transparent 70%); bottom: -100px; right: -80px; pointer-events: none; }
.login-card { background: var(--surface); border-radius: 24px; padding: 48px 36px 40px; width: 100%; max-width: 400px; box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,.05); position: relative; z-index: 1; }
.login-brand { text-align: center; margin-bottom: 32px; }
.login-logo { width: 72px; height: 72px; background: var(--dark); border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 8px 32px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06); position: relative; }
.login-logo::after { content: ''; position: absolute; inset: -3px; border-radius: 21px; background: conic-gradient(from 180deg, var(--gold), rgba(255,209,0,.2), var(--gold)); z-index: -1; }
.login-logo svg { width: 36px; height: 36px; }
.login-brand h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -.02em; color: var(--text); }
.login-brand span { display: block; font-size: .78rem; font-weight: 500; color: var(--text-3); margin-top: 2px; letter-spacing: .08em; text-transform: uppercase; }
.login-field { margin-bottom: 16px; }
.login-field label { display: block; font-size: .72rem; font-weight: 700; margin-bottom: 6px; color: var(--text-3); text-transform: uppercase; letter-spacing: .6px; }
.login-field select, .login-field input { width: 100%; padding: 14px 16px; border: 1.5px solid var(--surface-3); border-radius: var(--radius-sm); font-size: .95rem; background: var(--surface); color: var(--text); transition: border-color .2s, box-shadow .2s; }
.login-field select:focus, .login-field input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold-glow); }
.login-error { color: var(--red); font-size: .8rem; min-height: 22px; margin-bottom: 4px; font-weight: 500; }

/* ── BUTTONS ── */
.btn { padding: 14px 28px; border-radius: var(--radius-sm); font-size: .9rem; font-weight: 700; transition: all .15s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; letter-spacing: .01em; }
.btn:active { transform: scale(.97); }
.btn-gold { background: var(--gold); color: var(--dark); box-shadow: 0 2px 8px rgba(255,209,0,.3); }
.btn-gold:active { background: var(--gold-dark); }
.btn-outline { background: transparent; border: 1.5px solid var(--surface-3); color: var(--text); }
.btn-outline:active { background: var(--surface-3); }
.btn-green { background: var(--green); color: #fff; box-shadow: 0 2px 8px rgba(16,185,129,.25); }
.btn-green:active { background: #059669; }
.btn-sm { padding: 8px 16px; font-size: .8rem; min-height: 36px; }
.btn-block { width: 100%; }

/* ── HEADER BAR (shared) ── */
.app-header { background: var(--dark); color: #fff; padding: calc(var(--safe-top) + 12px) 20px 14px; display: flex; align-items: center; gap: 14px; position: relative; z-index: 10; }
.app-header::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,209,0,.15), transparent); }
.app-header .back-btn { background: rgba(255,255,255,.08); color: var(--gold); width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: background .15s; }
.app-header .back-btn:active { background: rgba(255,255,255,.15); }
.app-header .back-btn svg { width: 18px; height: 18px; }
.header-brand { font-size: 1.05rem; font-weight: 700; color: var(--gold); display: flex; align-items: center; gap: 10px; }
.header-brand svg { width: 22px; height: 22px; }
.header-info { flex: 1; min-width: 0; }
.header-title { font-size: .95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-sub { font-size: .78rem; color: rgba(255,255,255,.6); margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 8px; }
.header-user { font-size: .8rem; color: rgba(255,255,255,.7); }

/* ── ROUTE LIST ── */
.routes-screen { background: var(--surface-2); }
.routes-body { flex: 1; overflow-y: auto; padding: 20px 20px calc(var(--safe-bottom) + 20px); -webkit-overflow-scrolling: touch; }
.routes-greeting { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
.routes-date { font-size: .82rem; color: var(--text-3); margin-bottom: 20px; }
.route-card { background: var(--surface); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 10px; box-shadow: var(--shadow-sm); border: 1px solid rgba(0,0,0,.04); display: flex; align-items: center; gap: 16px; transition: all .15s; }
.route-card:active { transform: scale(.98); box-shadow: var(--shadow); }
.route-card-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--gold-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.route-card-icon svg { width: 22px; height: 22px; color: var(--gold-dark); }
.route-card-body { flex: 1; min-width: 0; }
.route-card-name { font-size: .95rem; font-weight: 700; margin-bottom: 1px; }
.route-card-day { font-size: .82rem; color: var(--text-2); }
.route-card-meta { font-size: .75rem; color: var(--text-3); margin-top: 3px; }
.route-card-badge { font-size: .72rem; font-weight: 700; padding: 5px 12px; border-radius: 20px; white-space: nowrap; background: var(--gold-bg); color: var(--gold-dark); flex-shrink: 0; }
.route-card-badge.done { background: var(--green-bg); color: var(--green); }
.no-routes { text-align: center; padding: 80px 20px; color: var(--text-3); }
.no-routes svg { width: 48px; height: 48px; color: var(--text-3); margin-bottom: 16px; opacity: .5; }

/* ── ACTIVE ROUTE ── */
.active-screen { background: var(--surface-2); }
.progress-bar { height: 4px; background: rgba(255,255,255,.1); margin-top: 6px; border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width .5s ease; }
#routeMap { width: 100%; height: 240px; background: var(--dark-3); flex-shrink: 0; }
.active-body { flex: 1; overflow-y: auto; padding: 0 0 calc(var(--safe-bottom) + 20px); -webkit-overflow-scrolling: touch; }

/* Current stop */
.current-stop { background: var(--surface); margin: 16px 16px 0; border-radius: var(--radius); padding: 22px 20px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.current-stop::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 4px; background: var(--gold); }
.current-stop-label { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--gold-dark); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.current-stop-label .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
.current-stop-name { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; letter-spacing: -.01em; }
.current-stop-acct { font-size: .78rem; color: var(--text-3); font-weight: 600; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.current-stop-addr { font-size: .85rem; color: var(--text-2); margin-bottom: 12px; line-height: 1.4; }
.current-stop-tags { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.stop-tag { display: inline-flex; align-items: center; gap: 5px; font-size: .75rem; font-weight: 600; color: var(--text-2); background: var(--surface-2); padding: 5px 10px; border-radius: 6px; }
.stop-tag svg { width: 14px; height: 14px; color: var(--text-3); }
.current-stop-actions { display: flex; gap: 10px; }
.current-stop-actions .btn { flex: 1; }

/* Stop list timeline */
.stop-list { padding: 0 16px; }
.stop-list-title { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--text-3); margin: 20px 0 12px; }
.stop-item { display: flex; align-items: stretch; gap: 0; margin-bottom: 0; transition: all .15s; }
.stop-timeline { display: flex; flex-direction: column; align-items: center; width: 40px; flex-shrink: 0; position: relative; }
.stop-timeline::before { content: ''; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--surface-3); }
.stop-item:first-child .stop-timeline::before { top: 50%; }
.stop-item:last-child .stop-timeline::before { bottom: 50%; }
.stop-num { width: 30px; height: 30px; border-radius: 50%; background: var(--surface); border: 2px solid var(--surface-3); color: var(--text-2); font-size: .75rem; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; z-index: 1; transition: all .2s; }
.stop-item.current .stop-num { background: var(--gold); border-color: var(--gold); color: var(--dark); box-shadow: 0 0 0 4px var(--gold-glow); }
.stop-item.done .stop-num { background: var(--green); border-color: var(--green); color: #fff; }
.stop-item.done .stop-num svg { width: 14px; height: 14px; }
.stop-item.done .stop-timeline::before { background: var(--green); }
.stop-card { flex: 1; background: var(--surface); border-radius: var(--radius-sm); padding: 14px 16px; margin: 3px 0; box-shadow: var(--shadow-sm); border: 1px solid rgba(0,0,0,.03); min-width: 0; }
.stop-item.current .stop-card { border-color: var(--gold); box-shadow: 0 2px 12px var(--gold-glow); }
.stop-item.done .stop-card { opacity: .55; }
.stop-card-name { font-size: .88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stop-card-detail { font-size: .75rem; color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── COMPLETE ── */
.complete-screen { background: var(--dark); align-items: center; justify-content: center; padding: 24px; }
.complete-card { background: var(--surface); border-radius: 24px; padding: 48px 32px 40px; width: 100%; max-width: 420px; text-align: center; box-shadow: var(--shadow-lg); }
.complete-badge { width: 80px; height: 80px; border-radius: 50%; background: var(--green-bg); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
.complete-badge svg { width: 40px; height: 40px; color: var(--green); }
.complete-card h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 24px; letter-spacing: -.02em; }
.complete-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
.stat-box { background: var(--surface-2); border-radius: var(--radius-sm); padding: 16px 12px; }
.stat-label { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-3); margin-bottom: 4px; }
.stat-value { font-size: 1.1rem; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }

/* ── TOAST ── */
.toast-container { position: fixed; top: calc(var(--safe-top) + 12px); left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; align-items: center; }
.toast { padding: 12px 20px; border-radius: var(--radius-sm); font-size: .84rem; font-weight: 600; color: #fff; opacity: 0; transform: translateY(-12px); transition: all .3s; pointer-events: none; margin-bottom: 6px; white-space: nowrap; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: rgba(16,185,129,.92); }
.toast.error { background: rgba(239,68,68,.92); }
.toast.info { background: rgba(30,30,30,.92); }

/* ── OFFLINE ── */
.offline-badge { position: fixed; bottom: calc(var(--safe-bottom) + 10px); left: 50%; transform: translateX(-50%); background: rgba(239,68,68,.92); color: #fff; padding: 8px 20px; border-radius: 24px; font-size: .75rem; font-weight: 700; z-index: 9000; display: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.offline-badge.show { display: block; }

/* ── LOADING SPINNER ── */
.spinner { width: 32px; height: 32px; border: 3px solid var(--surface-3); border-top-color: var(--gold); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>
<div class="offline-badge" id="offlineBadge">Offline — changes sync when reconnected</div>

<!-- LOGIN -->
<div class="screen login-screen active" id="loginScreen">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C12 2 6 9 6 14a6 6 0 0 0 12 0c0-5-6-12-6-12z" fill="#FFD100"/>
          <path d="M12 6c0 0-3 4-3 7a3 3 0 0 0 6 0c0-3-3-7-3-7z" fill="#0C0C0C" opacity=".3"/>
        </svg>
      </div>
      <h1>Fry Mizer</h1>
      <span>Driver</span>
    </div>
    <div class="login-field">
      <label>Name</label>
      <select id="loginUser"></select>
    </div>
    <div class="login-field">
      <label>PIN</label>
      <input type="password" id="loginPin" maxlength="6" inputmode="numeric" placeholder="Enter your PIN">
    </div>
    <div class="login-error" id="loginError"></div>
    <button class="btn btn-gold btn-block" onclick="login()">Sign In</button>
    <div style="font-size:.7rem;color:var(--text-3);margin-top:16px;text-align:center" id="loginPlant"></div>
  </div>
</div>

<!-- ROUTE LIST -->
<div class="screen routes-screen" id="routesScreen">
  <div class="app-header">
    <div class="header-brand">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C12 2 6 9 6 14a6 6 0 0 0 12 0c0-5-6-12-6-12z" fill="#FFD100"/></svg>
      Fry Mizer
    </div>
    <div class="header-right">
      <span class="header-user" id="routesUser"></span>
      <button class="btn btn-sm btn-outline" style="color:var(--gold);border-color:rgba(255,209,0,.2)" onclick="logoutDriver()">Sign Out</button>
    </div>
  </div>
  <div class="routes-body" id="routesBody">
    <div class="routes-greeting" id="routesGreeting"></div>
    <div class="routes-date" id="routesDate"></div>
    <div id="routeCards"></div>
  </div>
</div>

<!-- ACTIVE ROUTE -->
<div class="screen active-screen" id="activeScreen">
  <div class="app-header">
    <button class="back-btn" onclick="backToRoutes()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="header-info">
      <div class="header-title" id="activeTitle"></div>
      <div class="header-sub" id="activeProgress"></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>
  <div id="routeMap"></div>
  <div class="active-body" id="activeBody"></div>
</div>

<!-- ROUTE COMPLETE -->
<div class="screen complete-screen" id="completeScreen">
  <div class="complete-card" id="completeContent"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   APP STATE
   ═══════════════════════════════════════════════════════════════ */
const APP = {
  apiUrl: '',
  plantId: '',
  mapsKey: '',
  currentUser: null,
  users: [],
  routes: [],
  currentRoute: null,
  currentStopIndex: 0,
  map: null,
  markers: [],
  directionsRenderer: null,
  cachedDirections: [],
};

function $(id) { return document.getElementById(id); }
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

const ICO = {
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  oil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C12 2 6 9 6 14a6 6 0 0 0 12 0c0-5-6-12-6-12z"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  nav: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>',
};

/* ═══════════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════════ */
function toast(msg, type) {
  type = type || 'info';
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  $('toastContainer').appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
}

/* ═══════════════════════════════════════════════════════════════
   SCREEN MANAGEMENT
   ═══════════════════════════════════════════════════════════════ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

/* ═══════════════════════════════════════════════════════════════
   CONFIG + DATA
   ═══════════════════════════════════════════════════════════════ */
const GITHUB_RAW = 'https://raw.githubusercontent.com/amcour18/frymizer-driver/main/data';

function dataUrl(path) {
  return GITHUB_RAW + '/' + path + '?t=' + Date.now();
}

async function loadAppConfig() {
  try {
    const resp = await fetch(dataUrl('config.json'));
    if (!resp.ok) throw new Error('No config');
    const config = await resp.json();
    APP.mapsKey = config.mapsKey || '';
    APP.allUsers = config.users || [];
    APP.plants = config.plants || [];
    if (APP.mapsKey && !window.google) {
      const s = document.createElement('script');
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + APP.mapsKey + '&libraries=geometry';
      s.async = true; s.defer = true;
      document.head.appendChild(s);
    }
    return true;
  } catch (e) {
    return false;
  }
}

/* ═══════════════════════════════════════════════════════════════
   LOGIN
   ═══════════════════════════════════════════════════════════════ */
async function loadLoginScreen() {
  showScreen('loginScreen');
  $('loginPlant').textContent = '';

  if (!APP.allUsers || !APP.allUsers.length) {
    const ok = await loadAppConfig();
    if (!ok || !APP.allUsers.length) {
      toast('No routes pushed yet — ask your scheduler', 'error');
      $('loginUser').innerHTML = '<option>No users loaded</option>';
      return;
    }
  }

  APP.users = APP.allUsers;
  $('loginUser').innerHTML = APP.users.map(u => '<option value="' + escHtml(u.name) + '">' + escHtml(u.name) + (u.plantId ? ' (Plant ' + escHtml(u.plantId) + ')' : '') + '</option>').join('');
}

function login() {
  const name = $('loginUser').value;
  const pin = $('loginPin').value;
  const user = APP.users.find(u => u.name === name && u.pin === pin);
  if (!user) {
    $('loginError').textContent = 'Invalid PIN.';
    $('loginPin').value = '';
    $('loginPin').focus();
    return;
  }
  APP.currentUser = user;
  APP.plantId = user.plantId || '';
  $('loginError').textContent = '';
  $('loginPin').value = '';
  loadAndStartRoute();
}

function logoutDriver() {
  APP.currentUser = null;
  APP.currentRoute = null;
  showScreen('loginScreen');
  $('loginPin').value = '';
}

/* ═══════════════════════════════════════════════════════════════
   ROUTE LIST
   ═══════════════════════════════════════════════════════════════ */
async function loadAndStartRoute() {
  try {
    const resp = await fetch(dataUrl(APP.plantId + '/routes.json'));
    if (!resp.ok) throw new Error('No routes');
    const allRoutes = await resp.json();
    const myRoutes = APP.currentUser.routes && APP.currentUser.routes.length
      ? allRoutes.filter(r => APP.currentUser.routes.some(ur => r.routeName.toLowerCase().includes(ur.toLowerCase())))
      : allRoutes;
    APP.routes = myRoutes;
    if (myRoutes.length > 0) {
      startRoute(0);
    } else {
      loadRouteList();
    }
  } catch (e) {
    loadRouteList();
  }
}

async function loadRouteList() {
  showScreen('routesScreen');
  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  $('routesGreeting').textContent = greeting + ', ' + APP.currentUser.name;
  $('routesUser').textContent = APP.currentUser.name;
  $('routesDate').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  $('routeCards').innerHTML = '<div style="text-align:center;padding:60px 20px"><div class="spinner"></div><div style="margin-top:16px;font-size:.85rem;color:var(--text-3)">Loading routes...</div></div>';

  try {
    const resp = await fetch(dataUrl(APP.plantId + '/routes.json'));
    if (!resp.ok) throw new Error('Failed');
    const allRoutes = await resp.json();

    const myRoutes = APP.currentUser.routes && APP.currentUser.routes.length
      ? allRoutes.filter(r => APP.currentUser.routes.some(ur => r.routeName.toLowerCase().includes(ur.toLowerCase())))
      : allRoutes;

    APP.routes = myRoutes;

    if (!myRoutes.length) {
      $('routeCards').innerHTML = '<div class="no-routes">' + ICO.pin + '<div style="margin-top:8px">No routes assigned yet.<br><span style="font-size:.85rem">Ask your scheduler to push routes.</span></div></div>';
      return;
    }

    let html = '';
    myRoutes.forEach((r, i) => {
      const completed = r.completedCount || 0;
      const pct = r.stopCount ? Math.round(completed / r.stopCount * 100) : 0;
      const isDone = pct === 100 && r.stopCount > 0;
      html += '<div class="route-card" onclick="startRoute(' + i + ')">' +
        '<div class="route-card-icon">' + ICO.pin + '</div>' +
        '<div class="route-card-body">' +
        '<div class="route-card-name">' + escHtml(r.routeName) + '</div>' +
        '<div class="route-card-day">' + escHtml(r.day) + '</div>' +
        '<div class="route-card-meta">' + r.stopCount + ' stops' + (r.assignee ? ' &middot; ' + escHtml(r.assignee) : '') + '</div>' +
        '</div>' +
        '<div class="route-card-badge' + (isDone ? ' done' : '') + '">' + (isDone ? 'Complete' : r.stopCount + ' stops') + '</div>' +
        '</div>';
    });
    $('routeCards').innerHTML = html;
  } catch (e) {
    $('routeCards').innerHTML = '<div class="no-routes">' + ICO.warn + '<div style="margin-top:8px">Could not load routes.<br><span style="font-size:.85rem">' + escHtml(e.message) + '</span></div></div>';
  }
}

/* ═══════════════════════════════════════════════════════════════
   ACTIVE ROUTE
   ═══════════════════════════════════════════════════════════════ */
async function startRoute(index) {
  const summary = APP.routes[index];
  try {
    const resp = await fetch(dataUrl(APP.plantId + '/' + encodeURIComponent(summary.routeName) + '/' + encodeURIComponent(summary.day) + '.json'));
    if (!resp.ok) throw new Error('Failed to load route');
    APP.currentRoute = await resp.json();
  } catch (e) {
    toast('Could not load route: ' + e.message, 'error');
    return;
  }

  loadRouteProgress(APP.currentRoute);

  const plant = APP.currentRoute.plant || {};
  const originLat = plant.lat || (APP.currentUser && APP.currentUser.lat) || null;
  const originLng = plant.lng || (APP.currentUser && APP.currentUser.lng) || null;
  APP.routeOrigin = originLat && originLng ? { lat: Number(originLat), lng: Number(originLng) } : null;

  APP.currentRoute.stops = await optimizeRoute(APP.currentRoute.stops, originLat, originLng);

  if (!APP.currentRoute.routeStartedAt) {
    APP.currentRoute.routeStartedAt = new Date().toISOString();
    patchRoute({ routeStartedAt: APP.currentRoute.routeStartedAt });
  }

  APP.currentStopIndex = APP.currentRoute.stops.findIndex(s => !s.done);
  if (APP.currentStopIndex < 0) APP.currentStopIndex = 0;

  showActiveRoute();
}

function showActiveRoute() {
  showScreen('activeScreen');
  const r = APP.currentRoute;
  const stops = r.stops || [];
  const doneCount = stops.filter(s => s.done).length;

  $('activeTitle').textContent = r.routeName;
  $('activeProgress').textContent = doneCount + ' of ' + stops.length + ' stops complete';
  $('progressFill').style.width = (stops.length ? Math.round(doneCount / stops.length * 100) : 0) + '%';

  if (doneCount === stops.length && stops.length > 0) {
    showRouteComplete();
    return;
  }

  const cs = stops[APP.currentStopIndex];
  const addr = [cs.address, [cs.city, cs.state, cs.zip].filter(Boolean).join(', ')].filter(Boolean).join(', ');

  let bodyHtml = '<div class="current-stop">' +
    '<div class="current-stop-label"><span class="pulse"></span> Next Stop</div>' +
    '<div class="current-stop-name">' + escHtml(cs.customerName || '') + '</div>' +
    '<div class="current-stop-acct">Acct #' + escHtml(String(cs.customerNumber || '')) + '</div>' +
    '<div class="current-stop-addr">' + escHtml(addr) + '</div>' +
    '<div class="current-stop-tags">' +
    (cs.typeOil ? '<span class="stop-tag">' + ICO.oil + ' ' + escHtml(cs.typeOil) + '</span>' : '') +
    (cs.serviceStart ? '<span class="stop-tag">' + ICO.clock + ' ' + escHtml(cs.serviceStart) + '</span>' : '') +
    '</div>' +
    '<div class="current-stop-actions">' +
    '<button class="btn btn-gold" onclick="navigateToStop(' + APP.currentStopIndex + ')">' + ICO.nav + ' Navigate</button>' +
    '<button class="btn btn-green" onclick="markStopDone(\'' + escHtml(String(cs.customerNumber)) + '\')">' + ICO.check + ' Done</button>' +
    '</div></div>';

  bodyHtml += '<div class="stop-list"><div class="stop-list-title">All Stops (' + doneCount + '/' + stops.length + ')</div>';
  stops.forEach((s, i) => {
    const isCurrent = i === APP.currentStopIndex;
    const cls = (s.done ? 'done' : '') + (isCurrent ? ' current' : '');
    bodyHtml += '<div class="stop-item ' + cls + '" onclick="' + (s.done ? '' : 'APP.currentStopIndex=' + i + ';showActiveRoute()') + '">' +
      '<div class="stop-timeline"><div class="stop-num">' + (s.done ? ICO.check : (i + 1)) + '</div></div>' +
      '<div class="stop-card"><div class="stop-card-name">' + escHtml(s.customerName || '') + '</div>' +
      '<div class="stop-card-detail">' + escHtml([s.city, s.state].filter(Boolean).join(', ')) + (s.typeOil ? ' &middot; ' + escHtml(s.typeOil) : '') + '</div></div>' +
      '</div>';
  });
  bodyHtml += '</div>';

  $('activeBody').innerHTML = bodyHtml;

  if (window.google && google.maps) {
    const o = APP.routeOrigin || {};
    initRouteMap(stops, o.lat, o.lng);
  }
}

/* ═══════════════════════════════════════════════════════════════
   ROUTE OPTIMIZATION
   ═══════════════════════════════════════════════════════════════ */
async function optimizeRoute(stops, originLat, originLng) {
  if (window.google && google.maps && originLat && originLng) {
    const geoStops = stops.filter(s => s.lat && s.lng);
    const noGeo = stops.filter(s => !s.lat || !s.lng);
    if (geoStops.length >= 2 && geoStops.length <= 25) {
      try {
        const origin = { lat: Number(originLat), lng: Number(originLng) };
        const waypoints = geoStops.map(s => ({
          location: { lat: Number(s.lat), lng: Number(s.lng) }, stopover: true
        }));
        const result = await new Promise((resolve, reject) => {
          new google.maps.DirectionsService().route({
            origin, destination: origin, waypoints,
            optimizeWaypoints: true, travelMode: 'DRIVING',
          }, (res, status) => {
            if (status === 'OK') resolve(res); else reject(new Error(status));
          });
        });
        const order = result.routes[0].waypoint_order;
        if (order && order.length === geoStops.length) {
          APP._optimizedDirections = result;
          const reordered = order.map(i => geoStops[i]);
          toast('Route optimized', 'success');
          return [...reordered, ...noGeo];
        }
      } catch (e) { /* fall through to geometric */ }
    }
  }
  return optimizeStopOrder(stops, originLat, originLng);
}

function optimizeStopOrder(stops, plantLat, plantLng) {
  const fixed = stops.filter(s => s.serviceStart);
  const flex = stops.filter(s => !s.serviceStart);
  fixed.sort((a, b) => parseTime(a.serviceStart) - parseTime(b.serviceStart));
  if (flex.length > 0 && plantLat && plantLng) {
    flex.forEach(s => {
      if (s.lat && s.lng) {
        s._dist = haversine(plantLat, plantLng, s.lat, s.lng);
        s._bearing = calcBearing(plantLat, plantLng, s.lat, s.lng);
      } else { s._dist = 0; s._bearing = 0; }
    });
    flex.sort((a, b) => b._dist - a._dist);
    if (flex.length > 1) {
      const startBearing = flex[0]._bearing;
      flex.sort((a, b) => {
        const ba = ((a._bearing - startBearing) + 360) % 360;
        const bb = ((b._bearing - startBearing) + 360) % 360;
        return ba - bb;
      });
    }
  }
  return [...fixed, ...flex];
}

function parseTime(str) {
  if (!str) return 0;
  const m = String(str).match(/(\d{1,2}):?(\d{2})?\s*(am|pm)?/i);
  if (!m) return 0;
  let h = parseInt(m[1]);
  const min = parseInt(m[2] || '0');
  const ampm = (m[3] || '').toLowerCase();
  if (ampm === 'pm' && h < 12) h += 12;
  if (ampm === 'am' && h === 12) h = 0;
  return h * 60 + min;
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 3959;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function calcBearing(lat1, lng1, lat2, lng2) {
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const y = Math.sin(dLng) * Math.cos(lat2 * Math.PI / 180);
  const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) - Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos(dLng);
  return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
}

/* ═══════════════════════════════════════════════════════════════
   GOOGLE MAPS
   ═══════════════════════════════════════════════════════════════ */
function initRouteMap(stops, plantLat, plantLng) {
  const mapDiv = $('routeMap');
  if (!mapDiv) return;

  const center = plantLat && plantLng ? { lat: Number(plantLat), lng: Number(plantLng) } : { lat: 34.95, lng: -81.93 };
  const map = new google.maps.Map(mapDiv, {
    center, zoom: 10,
    mapTypeControl: false, streetViewControl: false, fullscreenControl: true,
    zoomControl: true,
    styles: [
      { elementType: 'geometry', stylers: [{ color: '#212121' }] },
      { elementType: 'labels.text.fill', stylers: [{ color: '#757575' }] },
      { elementType: 'labels.text.stroke', stylers: [{ color: '#212121' }] },
      { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#383838' }] },
      { featureType: 'road', elementType: 'labels.text.fill', stylers: [{ color: '#8a8a8a' }] },
      { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#000000' }] },
    ],
  });
  APP.map = map;

  APP.markers.forEach(m => m.setMap(null));
  APP.markers = [];

  const bounds = new google.maps.LatLngBounds();
  stops.forEach((s, i) => {
    if (!s.lat || !s.lng) return;
    const pos = { lat: Number(s.lat), lng: Number(s.lng) };
    bounds.extend(pos);
    const marker = new google.maps.Marker({
      position: pos, map,
      label: { text: String(i + 1), color: '#000', fontWeight: '700', fontSize: '11px' },
      icon: {
        path: google.maps.SymbolPath.CIRCLE, scale: 14,
        fillColor: s.done ? '#10B981' : '#FFD100', fillOpacity: 1,
        strokeColor: '#000', strokeWeight: 2,
      },
    });
    APP.markers.push(marker);
  });
  if (stops.some(s => s.lat && s.lng)) map.fitBounds(bounds, 40);

  requestFullRouteDirections(stops, plantLat, plantLng);
}

function requestFullRouteDirections(stops, plantLat, plantLng) {
  const geoStops = stops.filter(s => s.lat && s.lng);
  if (geoStops.length < 1 || !plantLat || !plantLng) return;

  APP.directionsRenderer = new google.maps.DirectionsRenderer({
    map: APP.map, suppressMarkers: true,
    polylineOptions: { strokeColor: '#FFD100', strokeWeight: 4, strokeOpacity: 0.8 },
  });

  if (APP._optimizedDirections) {
    APP.directionsRenderer.setDirections(APP._optimizedDirections);
    cacheDirectionsText(APP._optimizedDirections);
    APP._optimizedDirections = null;
    return;
  }

  const origin = { lat: Number(plantLat), lng: Number(plantLng) };
  const waypoints = geoStops.map(s => ({ location: { lat: Number(s.lat), lng: Number(s.lng) }, stopover: true }));

  new google.maps.DirectionsService().route({
    origin, destination: origin, waypoints, travelMode: 'DRIVING',
  }, (result, status) => {
    if (status === 'OK') {
      APP.directionsRenderer.setDirections(result);
      cacheDirectionsText(result);
    }
  });
}

function cacheDirectionsText(result) {
  const legs = result.routes[0].legs;
  APP.cachedDirections = legs.map((leg, i) => ({
    stopIndex: i, distance: leg.distance.text, duration: leg.duration.text,
    steps: leg.steps.map(s => ({ instruction: s.instructions, distance: s.distance.text, duration: s.duration.text })),
  }));
  try { localStorage.setItem('frymizer_cached_directions', JSON.stringify(APP.cachedDirections)); } catch (e) {}
}

/* ═══════════════════════════════════════════════════════════════
   NAVIGATION
   ═══════════════════════════════════════════════════════════════ */
function navigateToStop(stopIndex) {
  const stop = APP.currentRoute.stops[stopIndex];
  const dest = (stop.lat && stop.lng)
    ? stop.lat + ',' + stop.lng
    : encodeURIComponent([stop.address, stop.city, stop.state, stop.zip].filter(Boolean).join(', '));
  window.open('https://www.google.com/maps/dir/?api=1&destination=' + dest + '&travelmode=driving', '_blank');
}

/* ═══════════════════════════════════════════════════════════════
   MARK DONE
   ═══════════════════════════════════════════════════════════════ */
async function markStopDone(customerNumber) {
  const stop = APP.currentRoute.stops.find(s => String(s.customerNumber) === String(customerNumber));
  if (!stop || stop.done) return;
  stop.done = true;
  stop.doneAt = new Date().toISOString();

  const idx = APP.currentRoute.stops.indexOf(stop);
  if (window.google && APP.markers[idx]) {
    APP.markers[idx].setIcon({
      path: google.maps.SymbolPath.CIRCLE, scale: 14,
      fillColor: '#10B981', fillOpacity: 1, strokeColor: '#000', strokeWeight: 2,
    });
  }

  await patchRoute({ stopId: customerNumber, done: true, doneAt: stop.doneAt });

  toast('Stop completed', 'success');
  advanceToNextStop();
}

function advanceToNextStop() {
  const stops = APP.currentRoute.stops;
  const nextIdx = stops.findIndex(s => !s.done);
  if (nextIdx < 0) {
    showRouteComplete();
    return;
  }
  APP.currentStopIndex = nextIdx;
  showActiveRoute();
}

/* ═══════════════════════════════════════════════════════════════
   ROUTE COMPLETE
   ═══════════════════════════════════════════════════════════════ */
function showRouteComplete() {
  showScreen('completeScreen');
  const r = APP.currentRoute;
  if (!r.routeCompletedAt) {
    r.routeCompletedAt = new Date().toISOString();
    patchRoute({ routeCompletedAt: r.routeCompletedAt });
  }

  const started = r.routeStartedAt ? new Date(r.routeStartedAt) : null;
  const finished = new Date(r.routeCompletedAt);
  const duration = started ? formatDuration(finished - started) : '--';

  $('completeContent').innerHTML =
    '<div class="complete-badge">' + ICO.trophy + '</div>' +
    '<h2>Route Complete</h2>' +
    '<div class="complete-stats">' +
    '<div class="stat-box"><div class="stat-label">Stops</div><div class="stat-value">' + r.stops.length + '/' + r.stops.length + '</div></div>' +
    '<div class="stat-box"><div class="stat-label">Duration</div><div class="stat-value">' + duration + '</div></div>' +
    '<div class="stat-box"><div class="stat-label">Started</div><div class="stat-value">' + (started ? started.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '--') + '</div></div>' +
    '<div class="stat-box"><div class="stat-label">Finished</div><div class="stat-value">' + finished.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '</div></div>' +
    '</div>' +
    '<button class="btn btn-gold btn-block" onclick="backToRoutes()">Return to Routes</button>';
}

function formatDuration(ms) {
  const mins = Math.round(ms / 60000);
  if (mins < 60) return mins + ' min';
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h + 'h ' + m + 'm';
}

function backToRoutes() {
  APP.currentRoute = null;
  APP.currentStopIndex = 0;
  loadRouteList();
}

/* ═══════════════════════════════════════════════════════════════
   API HELPERS
   ═══════════════════════════════════════════════════════════════ */
function saveRouteProgress() {
  if (!APP.currentRoute) return;
  const r = APP.currentRoute;
  const key = 'frymizer_progress_' + r.plantId + '_' + r.routeName + '_' + r.day;
  const progress = {
    routeStartedAt: r.routeStartedAt || null,
    routeCompletedAt: r.routeCompletedAt || null,
    stops: (r.stops || []).map(s => ({ customerNumber: s.customerNumber, done: !!s.done, doneAt: s.doneAt || null })),
  };
  localStorage.setItem(key, JSON.stringify(progress));
}

function loadRouteProgress(route) {
  const key = 'frymizer_progress_' + route.plantId + '_' + route.routeName + '_' + route.day;
  const saved = localStorage.getItem(key);
  if (!saved) return;
  const progress = JSON.parse(saved);
  if (progress.routeStartedAt) route.routeStartedAt = progress.routeStartedAt;
  if (progress.routeCompletedAt) route.routeCompletedAt = progress.routeCompletedAt;
  (progress.stops || []).forEach(p => {
    const stop = (route.stops || []).find(s => String(s.customerNumber) === String(p.customerNumber));
    if (stop && p.done) { stop.done = true; stop.doneAt = p.doneAt; }
  });
}

async function patchRoute(updates) {
  saveRouteProgress();
}

window.addEventListener('online', () => { $('offlineBadge').classList.remove('show'); });
window.addEventListener('offline', () => { $('offlineBadge').classList.add('show'); });

/* ═══════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  loadLoginScreen();
  $('loginPin').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
});
</script>
